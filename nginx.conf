server {
    # 8080 y no 80: permite ejecutar Nginx como usuario sin privilegios.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version de Nginx en las cabeceras.
    server_tokens off;

    # Cabeceras de seguridad basicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El service worker NO debe cachearse, o los navegadores se quedarian
    # con una version antigua y dejarian de recibir notificaciones nuevas.
    location = /firebase-messaging-sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: React Router resuelve las rutas en el cliente, asi que cualquier
    # path desconocido debe devolver index.html en lugar de un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
